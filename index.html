<style>
  :root{
    --ink:#14161F;
    --surface:#1C1F2E;
    --surface-2:#232741;
    --raised:#282C48;
    --hair:#31344a;
    --hair-soft:#282b3d;
    --text:#ECEAE2;
    --text-dim:#9498AC;
    --text-faint:#666B82;
    --amber:#E8A33D;
    --amber-dim:rgba(232,163,61,0.16);
    --amber-line:rgba(232,163,61,0.4);
    --green:#6FA287;
    --green-dim:rgba(111,162,135,0.16);
    --clay:#BE6A50;
    --clay-dim:rgba(190,106,80,0.14);
    --blue:#7C93C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}

  a{color:var(--amber);text-decoration:none;}
  a:hover{text-decoration:underline;}

  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber);outline-offset:2px;
  }

  .wrap{max-width:1360px;margin:0 auto;padding:32px 28px 80px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--hair);
    padding-bottom:20px;margin-bottom:28px;
    gap:20px;flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--amber);margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:32px;
    margin:0;letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim);font-size:13.5px;margin-top:6px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .btn{
    padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .btn-primary{background:var(--amber);color:#221604;}
  .btn-primary:hover{background:#f0ae4d;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--hair);}
  .btn-ghost:hover{background:var(--raised);}
  .btn-danger-ghost{background:transparent;color:var(--clay);border:1px solid rgba(190,106,80,0.35);}
  .btn-danger-ghost:hover{background:var(--clay-dim);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}

  /* ---------- Funnel ---------- */
  .funnel-card{
    background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--hair);border-radius:14px;
    padding:22px 24px 20px;margin-bottom:22px;
    position:relative;overflow:hidden;
  }
  .funnel-title-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .funnel-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--text);}
  .funnel-note{font-size:12px;color:var(--text-faint);}
  .backlog-chip{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);
    background:var(--raised);border:1px solid var(--hair);border-radius:20px;
    padding:5px 12px;display:inline-flex;gap:6px;align-items:center;
  }
  .backlog-chip b{color:var(--text);font-weight:600;}

  .funnel-row{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px;}
  .funnel-stage{
    flex:1;min-width:118px;text-align:center;padding:6px 10px;position:relative;
  }
  .funnel-stage .count{
    font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1;
    color:var(--text);
  }
  .funnel-stage.interested .count, .funnel-stage.booked .count{color:var(--amber);}
  .funnel-stage .label{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--text-dim);margin-top:6px;
  }
  .funnel-arrow{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:56px;color:var(--text-faint);
  }
  .funnel-arrow .pct{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--green);font-weight:600;}
  .funnel-arrow svg{opacity:0.5;margin-top:2px;}

  .not-interested-strip{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--hair-soft);
    display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-faint);
  }
  .not-interested-strip .n{color:var(--clay);font-family:'IBM Plex Mono',monospace;font-weight:600;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;gap:12px;flex-wrap:wrap;
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filters select, .filters input{
    background:var(--surface-2);border:1px solid var(--hair);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:'Inter',sans-serif;
  }
  .filters input{min-width:170px;}

  /* ---------- Board ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px;}
  .col{
    min-width:238px;flex:1;background:var(--surface);border:1px solid var(--hair-soft);
    border-radius:12px;padding:12px;display:flex;flex-direction:column;max-height:640px;
  }
  .col.not-interested{opacity:0.72;}
  .col-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:2px 4px 12px;border-bottom:1px solid var(--hair-soft);margin-bottom:10px;
  }
  .col-head .name{font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--text-dim);}
  .col-head .count{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-faint);
    background:var(--raised);border-radius:10px;padding:2px 8px;
  }
  .cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;padding-right:2px;}
  .cards::-webkit-scrollbar{width:6px;}
  .cards::-webkit-scrollbar-thumb{background:var(--hair);border-radius:3px;}

  .card{
    background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;
    padding:10px 11px;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  }
  .card:hover{border-color:var(--amber-line);}
  .card .cname{font-size:13.5px;font-weight:600;color:var(--text);}
  .card .ccompany{font-size:12px;color:var(--text-dim);margin-top:1px;}
  .card .cmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;
    padding:2px 6px;border-radius:5px;color:var(--text-dim);background:var(--raised);
  }
  .tag.apollo{color:#9CB4E8;}
  .tag.linkedin{color:#7BB6D9;}
  .card .cdate{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-faint);}

  .card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .mini-btn{
    font-size:10.5px;font-family:'Inter',sans-serif;font-weight:600;
    padding:5px 8px;border-radius:6px;background:var(--raised);color:var(--text-dim);
    border:1px solid var(--hair);display:inline-flex;align-items:center;gap:4px;
    transition:all .12s ease;white-space:nowrap;
  }
  .mini-btn:hover{color:var(--text);border-color:var(--amber-line);}
  .mini-btn.accent{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-line);}
  .mini-btn.accent:hover{background:var(--amber);color:#221604;}
  .field-actions-row{display:flex;gap:8px;margin:-4px 0 14px;flex-wrap:wrap;}
  .msg-preview{
    background:var(--surface-2);border:1px dashed var(--hair);border-radius:8px;
    padding:10px 11px;font-size:11.5px;color:var(--text-dim);line-height:1.55;margin-bottom:14px;
  }

  .empty-col{color:var(--text-faint);font-size:12px;text-align:center;padding:20px 4px;}

  /* ---------- Stale review panel ---------- */
  .stale-card{
    background:var(--surface);border:1px solid rgba(190,106,80,0.32);border-radius:14px;
    padding:18px 20px 16px;margin-bottom:22px;
  }
  .stale-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .stale-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
  .stale-count{background:var(--clay-dim);color:var(--clay);border-radius:10px;padding:1px 9px;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .stale-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stale-instructions{
    font-size:12px;color:var(--text-faint);margin:10px 0 14px;line-height:1.55;
    padding-bottom:12px;border-bottom:1px solid var(--hair-soft);
  }
  .stale-instructions b{color:var(--text-dim);}
  .stale-rows{display:flex;flex-direction:column;gap:8px;}
  .stale-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;padding:9px 12px;

  .stale-name{font-size:13px;font-weight:600;color:var(--text);}
  .stale-name .stale-company{font-weight:400;color:var(--text-dim);}
  .stale-meta{font-size:10.5px;color:var(--text-faint);margin-top:2px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.03em;}
  .stale-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .mini-btn.accent-clay:hover{background:var(--clay);color:#1c0f0a;}
  .stale-empty{font-size:12.5px;color:var(--text-faint);padding:4px 2px 0;}

  /* ---------- Modal ---------- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(10,11,17,0.7);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--hair);border-radius:14px;
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    padding:24px 24px 20px;
  }
  .modal h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;text-transform:uppercase;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--hair);color:var(--text);
    border-radius:7px;padding:10px 11px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}
  .close-x{
    position:absolute;top:16px;right:18px;background:none;color:var(--text-faint);font-size:20px;
    line-height:1;padding:2px 6px;border-radius:6px;
  }
  .close-x:hover{color:var(--text);background:var(--raised);}
  .modal{position:relative;}

  .footer-note{
    text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:26px;
  }

  .loading{padding:60px;text-align:center;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  @media (max-width:720px){
    h1{font-size:24px;}
    .funnel-stage .count{font-size:24px;}
    .funnel-arrow{min-width:30px;}
    .board{flex-direction:column;}
    .col{min-width:100%;max-height:none;}
  }
</style>

  function exportCSV(){
    var headers = ['Name','Company','Region','Source','Status','LinkedIn','Notes','Date Added','Date Status Changed'];
    var lines = [headers.join(',')];
    people.forEach(function(p){
      var stageLabel = STAGES.find(function(s){return s.key===p.status;});
      var row = [p.name,p.company,p.region,p.source,(stageLabel?stageLabel.label:p.status),p.linkedin,p.notes,p.dateAdded,p.dateStatusChanged]
        .map(function(v){ v = (v||'').toString().replace(/"/g,'""'); return '"'+v+'"'; });
      lines.push(row.join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'outreach-pipeline-'+todayStr()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function parseCSV(text){
    var rows = [], field='', row=[], inQuotes=false, i=0;
    while(i < text.length){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        } else { field+=c; i++; continue; }
      } else {
        if(c === '"'){ inQuotes=true; i++; continue; }
        if(c === ','){ row.push(field); field=''; i++; continue; }
        if(c === '\r'){ i++; continue; }
        if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
        field+=c; i++; continue;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  }

  function labelToStatusKey(label){
    var found = STAGES.find(function(s){ return s.label.toLowerCase()===String(label||'').trim().toLowerCase(); });
    return found ? found.key : 'to_contact';
  }

  function findCol(header, aliases){
    for(var i=0;i<aliases.length;i++){
      var idx = header.indexOf(aliases[i]);
      if(idx>-1) return idx;
    }
    return -1;
  }

  function normalizeUrl(url){
    return (url||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'');
  }
  function normalizeText(s){ return (s||'').trim().toLowerCase(); }

  function isDuplicate(candidate){
    var candLi = normalizeUrl(candidate.linkedin);
    var candName = normalizeText(candidate.name);
    var candCompany = normalizeText(candidate.company);
    return people.some(function(p){
      var pLi = normalizeUrl(p.linkedin);
      if(candLi && pLi && candLi===pLi) return true;
      if(candName && candName===normalizeText(p.name) && candCompany===normalizeText(p.company)) return true;
      return false;
    });
  }

  function importCSVFile(file){
    var reader = new FileReader();
    reader.onload = async function(e){
      try{
        var rows = parseCSV(String(e.target.result||''));
        if(!rows.length){ alert('That file looks empty.'); return; }
        var header = rows[0].map(function(h){return h.trim().toLowerCase();});

        var idxName = header.indexOf('name');
        var idxFirst = findCol(header, ['first name','firstname']);
        var idxLast = findCol(header, ['last name','lastname']);
        var idxCompany = findCol(header, ['company','company name','account name']);
        var idxRegionNative = header.indexOf('region');
        var idxCity = header.indexOf('city');
        var idxCountry = header.indexOf('country');
        var idxSource = header.indexOf('source');
        var idxStatus = header.indexOf('status');
        var idxLinkedin = findCol(header, ['linkedin','person linkedin url','linkedin url']);
        var idxNotes = header.indexOf('notes');
        var idxTitle = header.indexOf('title');
        var idxSeniority = header.indexOf('seniority');
        var idxDateAdded = header.indexOf('date added');
        var idxDateChanged = header.indexOf('date status changed');

        var isNativeFormat = idxName > -1 && idxDateAdded > -1;

        if(!isNativeFormat && idxFirst===-1 && idxName===-1){
          alert('Could not recognize this CSV\'s columns. Make sure it\'s exported from this tool, or a People Search export from Apollo.');
          return;
        }

        var added = 0, skipped = 0;
        for(var r=1;r<rows.length;r++){
          var row = rows[r];
          if(!row) continue;
          var name = idxName>-1 ? (row[idxName]||'').trim()
            : [(idxFirst>-1?row[idxFirst]:'')||'', (idxLast>-1?row[idxLast]:'')||''].map(function(s){return s.trim();}).filter(Boolean).join(' ');
          if(!name) continue;

          var region = '';
          if(isNativeFormat && idxRegionNative>-1){
            region = row[idxRegionNative]||'';
          } else {
            var country = idxCountry>-1 ? (row[idxCountry]||'').trim() : '';
            var city = idxCity>-1 ? (row[idxCity]||'').trim() : '';
            if(/san francisco/i.test(city)) region = 'San Francisco';
            else if(country && !/united states/i.test(country)) region = 'International';
            else if(country) region = 'US (outside SF)';
          }

          var notesParts = [];
          if(idxTitle>-1 && row[idxTitle]) notesParts.push('Title: '+row[idxTitle]);
          if(idxSeniority>-1 && row[idxSeniority]) notesParts.push('Seniority: '+row[idxSeniority]);
          var notes = (idxNotes>-1 && row[idxNotes]) ? row[idxNotes] : notesParts.join(' · ');

          var source = (idxSource>-1 && row[idxSource]) ? row[idxSource] : (isNativeFormat ? 'Manual' : 'Apollo');
          var status = (isNativeFormat && idxStatus>-1) ? labelToStatusKey(row[idxStatus]) : 'to_contact';
          var company = idxCompany>-1 ? (row[idxCompany]||'').trim() : '';
          var linkedin = idxLinkedin>-1 ? (row[idxLinkedin]||'').trim() : '';

          if(isDuplicate({name:name, company:company, linkedin:linkedin})){
            skipped++;
            continue;
          }

          people.unshift({
            id: uid(),
            name: name,
            company: company,
            region: region,
            source: source,
            status: status,
            linkedin: linkedin,
            notes: notes,
            dateAdded: (isNativeFormat && idxDateAdded>-1 && row[idxDateAdded]) ? row[idxDateAdded] : todayStr(),
            dateStatusChanged: (isNativeFormat && idxDateChanged>-1 && row[idxDateChanged]) ? row[idxDateChanged] : todayStr()
          });
          added++;
        }
        await saveData();
        render();
        alert('Imported '+added+' new people'+(isNativeFormat?'':' from Apollo')+' into To Contact.'+(skipped?(' Skipped '+skipped+' already in your pipeline.'):''));
      }catch(err){
        alert('Could not read that CSV — make sure it\'s exported from this tool or from Apollo.');
      }
    };
    reader.readAsText(file);
  }

      render();
    },
    setStatusQuick:async function(id, newStatus){
      var p = people.find(function(pp){return pp.id===id;});
      if(!p) return;
      p.status = newStatus;
      p.dateStatusChanged = todayStr();
      await saveData();
      render();
    },
    exportCSV:exportCSV,
    handleImportFile:function(inputEl){
      var file = inputEl.files && inputEl.files[0];
      if(file) importCSVFile(file);
      inputEl.value = '';
    }
  };

  loadData();
})();
</script>
</body>
</html>
